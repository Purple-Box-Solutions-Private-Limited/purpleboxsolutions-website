const u=s=>Uint8Array.from(atob(s),x=>x.charCodeAt(0)),K='pb-desk-code';
async function unlock(pass){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.s),iterations:D.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.i)},key,u(D.c)));
}
function show(h){document.open();document.write(h);document.close()}
const f=document.getElementById('f'),p=document.getElementById('p'),b=document.getElementById('b'),m=document.getElementById('msg');
f.addEventListener('submit',async e=>{e.preventDefault();b.disabled=true;m.textContent='';
  const pass=p.value.trim().toLowerCase();
  try{const h=await unlock(pass);if(document.getElementById('r').checked){try{localStorage.setItem(K,pass)}catch(_){}}show(h)}
  catch(_){m.textContent='That code did not work.';b.disabled=false;p.select()}});
(async()=>{let s=null;try{s=localStorage.getItem(K)}catch(_){}
  if(s){try{show(await unlock(s))}catch(_){try{localStorage.removeItem(K)}catch(_){}}}})();
</script></body></html>
